; Jeopardy base station — Seeed XIAO ESP32-S3
; USB: TinyUSB HID keyboard + CDC serial status (requires USB_MODE=0)
;
; Build/flash: pio run -e base -t upload
; Monitor CDC: pio device monitor -b 115200
;
; NOTE: Board default is USB Serial/JTAG (USB_MODE=1). We unflag that and
; force TinyUSB SoftUSB for HID. First flash may need BOOT-held upload; after
; that the CDC port appears as a normal ACM device.

[env:base]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../common
    -Iinclude
lib_deps =
