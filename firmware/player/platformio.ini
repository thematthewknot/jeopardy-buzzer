; Jeopardy contestant (player) — Seeed XIAO ESP32-S3
; Build:  pio run -e player
; Flash:  pio run -e player -t upload
; Set ID: pio run -e player --project-option "build_flags=-DPLAYER_ID=3" ...
;    or edit include/config.h / use -DPLAYER_ID=n in build_flags below.

[env:player]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DPLAYER_ID=1
    -I../common
    -Iinclude
lib_deps =
build_src_filter = +<*>
